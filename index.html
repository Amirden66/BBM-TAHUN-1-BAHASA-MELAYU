<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabaran Gema Suara Pintar - BM Tahun 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .game-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
        }
        .header-title {
            font-family: 'Fredoka One', cursive;
            color: #d946ef;
            font-size: 26px;
            margin-bottom: 5px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 10px 18px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-weight: 700;
            color: #334155;
            font-size: 14px;
        }
        .lives { color: #ef4444; font-size: 18px; }
        .level-badge {
            background: #d946ef;
            color: white;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        
        /* Countdown Bar */
        .timer-bar-container {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 100%);
            transition: width 1s linear;
        }

        /* Image Display & Word Box */
        .word-card-container {
            background: #fdf2f8;
            border: 3px dashed #f472b6;
            border-radius: 25px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .word-image {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            border: 4px solid #ffffff;
            background-color: #ffffff;
        }
        .target-word {
            font-family: 'Fredoka One', cursive;
            font-size: 46px;
            color: #1e293b;
            line-height: 1.1;
        }
        .syllable-hint {
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Mic Button */
        .mic-btn-container {
            margin: 15px 0;
        }
        .btn-mic {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: white;
            border: none;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            font-size: 34px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
            transition: all 0.2s ease;
            outline: none;
        }
        .btn-mic:hover { transform: scale(1.08); }
        .btn-mic.listening {
            animation: pulse 1.2s infinite;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.5);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Status Feedback */
        .status-msg {
            font-size: 16px;
            font-weight: 700;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
        }
        .status-msg.normal { color: #64748b; }
        .status-msg.correct { background: #d1fae5; color: #047857; }
        .status-msg.wrong { background: #fee2e2; color: #b91c1c; }

        /* Final Result Screen */
        .result-screen {
            display: none;
            padding: 20px 0;
        }
        .result-title {
            font-family: 'Fredoka One', cursive;
            font-size: 32px;
            color: #d946ef;
            margin-bottom: 10px;
        }
        .btn-restart {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Play Screen -->
    <div id="playScreen">
        <h1 class="header-title">🎤 Cabaran Gema Suara</h1>
        
        <div class="status-bar">
            <div>Nyawa: <span class="lives" id="livesDisplay">❤️❤️❤️</span></div>
            <div class="level-badge" id="levelBadge">TAHAP 1</div>
            <div>Markah: <span id="scoreDisplay" style="color:#d946ef;">0</span></div>
        </div>

        <div class="timer-bar-container">
            <div class="timer-bar" id="timerBar"></div>
        </div>

        <div class="word-card-container">
            <img id="wordImage" class="word-image" src="" alt="Gambar Perkataan">
            <div class="target-word" id="targetWord">cili</div>
            <div class="syllable-hint" id="syllableHint">Sebut: ci + li</div>
        </div>

        <div class="mic-btn-container">
            <button class="btn-mic" id="micBtn" onclick="startRecognition()">🎙️</button>
        </div>

        <div class="status-msg normal" id="statusMsg">Tekan mikrofon & sebut!</div>
    </div>

    <!-- Game Over / Result Screen -->
    <div class="result-screen" id="resultScreen">
        <h1 class="result-title" id="resultTitle">TAHNIAH! 🎉</h1>
        <p id="resultDesc" style="font-weight: 600; color: #475569;">Anda berjaya menamatkan cabaran!</p>
        <div style="font-size: 50px; margin: 15px 0;" id="starsDisplay">⭐⭐⭐</div>
        <p style="font-size: 22px; font-weight: 700; color: #1e293b;">
            Jumlah Markah: <span id="finalScore" style="color: #d946ef;">0</span>
        </p>
        <button class="btn-restart" onclick="restartGame()">🔄 Cuba Lagi</button>
    </div>
</div>

<script>
    // Bank Perkataan KSSR Bahasa Melayu Tahun 1
    const masterWordList = [
        // Tahap 1: 2 Suku Kata Asas KV (Masa 10s)
        { word: 'cili', hint: 'ci + li', level: 1, time: 10, img: 'https://images.unsplash.com/photo-1588252303782-cb80119abd6d?w=300&auto=format&fit=crop&q=80' },
        { word: 'guli', hint: 'gu + li', level: 1, time: 10, img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=80' },
        { word: 'gigi', hint: 'gi + gi', level: 1, time: 10, img: 'https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?w=300&auto=format&fit=crop&q=80' },
        { word: 'dada', hint: 'da + da', level: 1, time: 10, img: 'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=300&auto=format&fit=crop&q=80' },
        { word: 'laci', hint: 'la + ci', level: 1, time: 10, img: 'https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=300&auto=format&fit=crop&q=80' },
        { word: 'buku', hint: 'bu + ku', level: 1, time: 10, img: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300&auto=format&fit=crop&q=80' },
        { word: 'kuda', hint: 'ku + da', level: 1, time: 10, img: 'https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=300&auto=format&fit=crop&q=80' },
        
        // Tahap 2: 2 Suku Kata KVK/Kombinasi (Masa 7s)
        { word: 'lebah', hint: 'le + bah', level: 2, time: 7, img: 'https://images.unsplash.com/photo-1558642452-9d2a7deb7f62?w=300&auto=format&fit=crop&q=80' },
        { word: 'pokok', hint: 'po + kok', level: 2, time: 7, img: 'https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?w=300&auto=format&fit=crop&q=80' },
        { word: 'bukit', hint: 'bu + kit', level: 2, time: 7, img: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=300&auto=format&fit=crop&q=80' },
        { word: 'datuk', hint: 'da + tuk', level: 2, time: 7, img: 'https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=300&auto=format&fit=crop&q=80' },
        { word: 'getah', hint: 'ge + tah', level: 2, time: 7, img: 'https://images.unsplash.com/photo-1582142306909-195724d33ffc?w=300&auto=format&fit=crop&q=80' },
        { word: 'kasut', hint: 'ka + sut', level: 2, time: 7, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300&auto=format&fit=crop&q=80' },
        { word: 'cawan', hint: 'ca + wan', level: 2, time: 7, img: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=300&auto=format&fit=crop&q=80' },

        // Tahap 3: 3 Suku Kata (Masa 5s - Mencabar!)
        { word: 'kereta', hint: 'ke + re + ta', level: 3, time: 5, img: 'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=300&auto=format&fit=crop&q=80' },
        { word: 'kerusi', hint: 'ke + ru + si', level: 3, time: 5, img: 'https://images.unsplash.com/photo-1580481072645-022f9a6d8310?w=300&auto=format&fit=crop&q=80' },
        { word: 'kemeja', hint: 'ke + me + ja', level: 3, time: 5, img: 'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=300&auto=format&fit=crop&q=80' },
        { word: 'kuali', hint: 'ku + a + li', level: 3, time: 5, img: 'https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=300&auto=format&fit=crop&q=80' },
        { word: 'tomato', hint: 'to + ma + to', level: 3, time: 5, img: 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300&auto=format&fit=crop&q=80' },
        { word: 'kepala', hint: 'ke + pa + la', level: 3, time: 5, img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80' }
    ];

    let currentGameList = [];
    let currentIndex = 0;
    let score = 0;
    let lives = 3;
    let timer;
    let timeLeft;

    // Web Audio Synthesizer (Sound Effects)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
        // Susun perkataan mengikut tahap dan rawak
        const level1 = shuffleArray(masterWordList.filter(w => w.level === 1));
        const level2 = shuffleArray(masterWordList.filter(w => w.level === 2));
        const level3 = shuffleArray(masterWordList.filter(w => w.level === 3));
        
        currentGameList = [...level1.slice(0,4), ...level2.slice(0,4), ...level3.slice(0,4)];
        currentIndex = 0;
        score = 0;
        lives = 3;

        document.getElementById('playScreen').style.display = 'block';
        document.getElementById('resultScreen').style.display = 'none';
        updateLivesDisplay();
        loadWord();
    }

    function updateLivesDisplay() {
        let hearts = '';
        for (let i = 0; i < lives; i++) hearts += '❤️';
        document.getElementById('livesDisplay').innerText = hearts || '💔';
    }

    function loadWord() {
        if (currentIndex >= currentGameList.length || lives <= 0) {
            endGame();
            return;
        }

        const item = currentGameList[currentIndex];
        document.getElementById('targetWord').innerText = item.word;
        document.getElementById('syllableHint').innerText = `Sebut: ${item.hint}`;
        document.getElementById('wordImage').src = item.img;
        document.getElementById('levelBadge').innerText = `TAHAP ${item.level}`;
        document.getElementById('scoreDisplay').innerText = score;

        const statusMsg = document.getElementById('statusMsg');
        statusMsg.innerText = "Tekan mikrofon & sebut!";
        statusMsg.className = "status-msg normal";

        resetTimer(item.time);
    }

    function resetTimer(seconds) {
        clearInterval(timer);
        timeLeft = seconds;
        const timerBar = document.getElementById('timerBar');
        timerBar.style.width = '100%';

        timer = setInterval(() => {
            timeLeft--;
            timerBar.style.width = `${(timeLeft / seconds) * 100}%`;

            if (timeLeft <= 0) {
                clearInterval(timer);
                playSound('wrong');
                lives--;
                updateLivesDisplay();

                const statusMsg = document.getElementById('statusMsg');
                statusMsg.innerText = "⏰ Masa Tamat! Nyawa berkurang.";
                statusMsg.className = "status-msg wrong";

                if (lives <= 0) {
                    setTimeout(endGame, 1500);
                } else {
                    setTimeout(nextWord, 1500);
                }
            }
        }, 1000);
    }

    function startRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("Pelayar web ini tidak menyokong pengecaman suara. Sila gunakan Google Chrome.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'ms-MY';
        recognition.interimResults = false;

        const micBtn = document.getElementById('micBtn');
        const statusMsg = document.getElementById('statusMsg');

        micBtn.classList.add('listening');
        statusMsg.innerText = "🎧 Mendengar suara anda...";
        statusMsg.className = "status-msg normal";

        recognition.start();

        recognition.onresult = function(event) {
            micBtn.classList.remove('listening');
            clearInterval(timer);

            const spokenWord = event.results[0][0].transcript.toLowerCase().trim();
            const currentTarget = currentGameList[currentIndex].word;

            if (spokenWord.includes(currentTarget)) {
                playSound('correct');
                score += (currentGameList[currentIndex].level * 10);
                
                statusMsg.innerText = `✅ BETUL! ("${spokenWord}")`;
                statusMsg.className = "status-msg correct";

                setTimeout(nextWord, 1200);
            } else {
                playSound('wrong');
                lives--;
                updateLivesDisplay();

                statusMsg.innerText = `❌ SALAH! (Aplikasi dengar: "${spokenWord}")`;
                statusMsg.className = "status-msg wrong";

                if (lives <= 0) {
                    setTimeout(endGame, 1500);
                } else {
                    setTimeout(nextWord, 1800);
                }
            }
        };

        recognition.onerror = function() {
            micBtn.classList.remove('listening');
            statusMsg.innerText = "⚠️ Masalah mengesan suara. Sila cuba lagi.";
            statusMsg.className = "status-msg wrong";
        };

        recognition.onend = function() {
            micBtn.classList.remove('listening');
        };
    }

    function nextWord() {
        currentIndex++;
        loadWord();
    }

    function endGame() {
        clearInterval(timer);
        document.getElementById('playScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
        document.getElementById('finalScore').innerText = score;

        const resultTitle = document.getElementById('resultTitle');
        const resultDesc = document.getElementById('resultDesc');
        const starsDisplay = document.getElementById('starsDisplay');

        if (lives > 0) {
            resultTitle.innerText = "TAHNIAH! 🎉";
            resultDesc.innerText = "Anda berjaya menamatkan semua Tahap!";
            if (score >= 180) starsDisplay.innerText = "⭐⭐⭐ (Cemerlang!)";
            else if (score >= 100) starsDisplay.innerText = "⭐⭐ (Bagus!)";
            else starsDisplay.innerText = "⭐ (Cuba Lagi!)";
        } else {
            resultTitle.innerText = "GAME OVER 💔";
            resultDesc.innerText = "Nyawa anda telah habis. Jangan putus asa!";
            starsDisplay.innerText = "⭐ (Cuba Lagi Ya!)";
        }
    }

    function restartGame() {
        initGame();
    }

    // Mula Permainan
    initGame();
</script>

</body>
</html>
